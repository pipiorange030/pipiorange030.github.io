<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>婵姐这大美妞就适合被诸葛法</title>
    <style>
        /* 基础重置 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        /* 自定义颜色变量 */
        :root {
            --primary: #0f1419;
            --secondary: #1e2732;
            --accent: #ff375f;
            --accent-light: #ff6b8b;
            --text-primary: #e7e9ea;
            --text-secondary: #8b98a5;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background-color: var(--primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* 模拟手机状态栏 */
        .status-bar {
            background: #000;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status-left, .status-right {
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .time {
            font-weight: 600;
        }
        
        .signal-icon, .wifi-icon, .battery-icon {
            width: 20px;
            height: 10px;
            position: relative;
        }
        
        .signal-icon:before {
            content: "📶";
        }
        
        .wifi-icon:before {
            content: "Wi-Fi";
            font-size: 10px;
        }
        
        .battery-icon:before {
            content: "🔋 84%";
            font-size: 10px;
        }
        
        .address-bar {
            background: var(--secondary);
            padding: 8px 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        
        .lock-icon:before {
            content: "🔒";
        }
        
        .url {
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        /* 主要内容容器 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }
        
        /* 标题区 */
        .header {
            text-align: center;
            padding: 30px 0 20px;
        }
        
        .main-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
            color: var(--accent);
            line-height: 1.3;
        }
        
        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            font-weight: 400;
        }
        
        /* 群信息卡片 */
        .group-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            margin: 0 0 30px;
        }
        
        .group-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .group-stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
        }
        
        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
        }
        
        .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-top: 5px;
        }
        
        .group-desc {
            color: var(--text-secondary);
            line-height: 1.6;
            text-align: center;
            font-size: 15px;
        }
        
        /* 成员列表 */
        .members-section {
            margin-top: 30px;
        }
        
        .section-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }
        
        .members-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .member-item {
            display: flex;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 15px;
        }
        
        .color-indicator {
            width: 6px;
            height: 40px;
            border-radius: 3px;
            margin-right: 15px;
        }
        
        .color-orange { background: linear-gradient(to bottom, #ff9500, #ff5e3a); }
        .color-purple { background: linear-gradient(to bottom, #bf5af2, #5e5ce6); }
        .color-green { background: linear-gradient(to bottom, #30d158, #34c759); }
        .color-blue { background: linear-gradient(to bottom, #5ac8fa, #007aff); }
        .color-pink { background: linear-gradient(to bottom, #ff375f, #ff2d55); }
        .color-yellow { background: linear-gradient(to bottom, #ffd60a, #ffcc00); }
        
        .member-info {
            flex: 1;
        }
        
        .member-display-name {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        
        .member-full-name {
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .member-status {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-online {
            background: rgba(52, 199, 89, 0.2);
            color: #30d158;
        }
        
        .status-offline {
            background: rgba(142, 142, 147, 0.2);
            color: #8e8e93;
        }
        
        /* 底部导航栏 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px;
        }
        
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 12px;
        }
        
        .nav-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
        
        .nav-active {
            color: var(--accent);
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
        
        /* 响应式调整 */
        @media (max-width: 500px) {
            .container {
                padding: 0 15px 100px;
            }
            
            .main-title {
                font-size: 24px;
            }
            
            .group-name {
                font-size: 20px;
            }
            
            .stat-value {
                font-size: 24px;
            }
            
            .group-stats {
                flex-direction: column;
                gap: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- 模拟手机状态栏 -->
    <div class="status-bar">
        <div class="status-left">
            <div class="time">14:43</div>
        </div>
        <div class="status-right">
            <div class="signal-icon"></div>
            <div class="wifi-icon"></div>
            <div class="battery-icon"></div>
        </div>
    </div>
    
    <!-- 地址栏 -->
    <div class="address-bar">
        <div class="lock-icon"></div>
        <div class="url">pipiorange030.github.io</div>
    </div>
    
    <!-- 主要内容 -->
    <div class="container">
        <header class="header fade-in">
            <h1 class="main-title">婵姐这大美妞就适合被诸葛法</h1>
            <p class="subtitle">群成员专属展示 | 高端设计呈现</p>
        </header>
        
        <div class="group-card fade-in">
            <h2 class="group-name">朱展信，要健康幸福</h2>
            <div class="group-stats">
                <div class="stat-item">
                    <div class="stat-value">21</div>
                    <div class="stat-label">群成员</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">2026</div>
                    <div class="stat-label">创建年份</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">活跃</div>
                    <div class="stat-label">当前状态</div>
                </div>
            </div>
            <p class="group-desc">
                这是一个由21位成员组成的活跃社交群组，成员们拥有多样的兴趣和独特的个性。群聊名称"朱展信，要健康幸福"寄托了所有成员对彼此的美好祝愿。
            </p>
        </div>
        
        <section class="members-section fade-in">
            <h2 class="section-title">群成员 (21人)</h2>
            <div class="members-list" id="membersList">
                <!-- 成员列表将通过JavaScript动态生成 -->
            </div>
        </section>
    </div>
    
    <!-- 底部导航栏 -->
    <div class="bottom-nav">
        <div class="nav-item nav-active">
            <div class="nav-icon">🏠</div>
            <div>主页</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">👥</div>
            <div>成员</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">💬</div>
            <div>聊天</div>
        </div>
        <div class="nav-item">
            <div class="nav-icon">⚙️</div>
            <div>设置</div>
        </div>
    </div>
    
    <script>
        // 成员数据 - 完全按照截图中的信息
        const members = [
            { short: "搭上", full: "搭上A...", status: "online", color: "orange" },
            { short: "小香", full: "小香猪...", status: "online", color: "purple" },
            { short: "登陆", full: "登陆少...", status: "offline", color: "green" },
            { short: "树莓", full: "树莓三...", status: "online", color: "blue" },
            { short: "十八", full: "十八朵...", status: "online", color: "pink" },
            { short: "不知", full: "不知立场", status: "online", color: "yellow" },
            { short: "不能", full: "不能还...", status: "offline", color: "orange" },
            { short: "云养", full: "云养俺妹", status: "online", color: "purple" },
            { short: "小妲", full: "小妲极", status: "online", color: "green" },
            { short: "余鲨", full: "余鲨鲨鲨", status: "online", color: "blue" },
            { short: "棍铲", full: "棍铲坤", status: "offline", color: "pink" },
            { short: "鞍山", full: "鞍山小...", status: "online", color: "yellow" },
            { short: "护腮", full: "护腮宝", status: "online", color: "orange" },
            { short: "是真", full: "是真呱...", status: "online", color: "purple" },
            { short: "ovo", full: "ovo", status: "online", color: "green" },
            { short: "七咩", full: "七咩", status: "offline", color: "blue" },
            { short: "jtdd", full: "jtddhk...", status: "online", color: "pink" },
            { short: "婵姐", full: "婵姐这...", status: "online", color: "orange", featured: true },
            { short: "Jack", full: "Jackey...", status: "online", color: "purple" },
            { short: "仙草", full: "仙草山...", status: "online", color: "green" },
            { short: "火龙", full: "火龙果...", status: "online", color: "blue" }
        ];
        
        // 颜色映射
        const colorMap = {
            orange: "color-orange",
            purple: "color-purple",
            green: "color-green",
            blue: "color-blue",
            pink: "color-pink",
            yellow: "color-yellow"
        };
        
        // 渲染成员列表
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('membersList');
            
            members.forEach((member, index) => {
                const memberItem = document.createElement('div');
                memberItem.className = 'member-item fade-in';
                memberItem.style.animationDelay = `${index * 0.05}s`;
                
                const statusClass = member.status === 'online' ? 'status-online' : 'status-offline';
                const statusText = member.status === 'online' ? '在线' : '离线';
                
                memberItem.innerHTML = `
                    <div class="color-indicator ${colorMap[member.color]}"></div>
                    <div class="member-info">
                        <div class="member-display-name">${member.short}</div>
                        <div class="member-full-name">${member.full}</div>
                    </div>
                    <div class="member-status ${statusClass}">${statusText}</div>
                `;
                
                container.appendChild(memberItem);
            });
            
            // 更新时间显示
            function updateTime() {
                const now = new Date();
                const hours = now.getHours().toString().padStart(2, '0');
                const minutes = now.getMinutes().toString().padStart(2, '0');
                document.querySelector('.time').textContent = `${hours}:${minutes}`;
            }
            
            updateTime();
            setInterval(updateTime, 60000);
            
            // 添加简单的交互效果
            const memberItems = document.querySelectorAll('.member-item');
            memberItems.forEach(item => {
                item.addEventListener('click', function() {
                    this.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        this.style.transform = 'scale(1)';
                    }, 150);
                });
            });
            
            // 导航栏交互
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    navItems.forEach(nav => nav.classList.remove('nav-active'));
                    this.classList.add('nav-active');
                });
            });
        });
    </script>
</body>
</html>
