<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>群成员展示 | 婵姐这大美妞就适合被诸葛法</title>
    <style>
        :root {
            --primary: #0f172a;
            --secondary: #1e293b;
            --accent: #f43f5e;
            --accent-light: #fb7185;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1rem;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 3px;
            background: var(--accent);
            border-radius: 3px;
        }

        .main-title {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 1rem;
            padding-left: 0.5rem;
            border-left: 4px solid var(--accent);
        }

        .group-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 1.5rem;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .group-name {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            text-align: center;
            color: var(--accent-light);
        }

        .group-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .stat-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.5rem;
        }

        .group-desc {
            color: var(--text-secondary);
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.8;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .member-card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .member-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(244, 63, 94, 0.2);
        }

        .member-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            font-weight: 700;
            color: white;
        }

        .member-name {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 0.5rem;
            word-break: break-all;
        }

        .member-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 0.5rem;
        }

        .status-online {
            background: rgba(74, 222, 128, 0.2);
            color: #4ade80;
        }

        .status-offline {
            background: rgba148, 163, 184, 0.2;
            color: var(--text-secondary);
        }

        .featured-member {
            border: 2px solid var(--accent);
            background: rgba(244, 63, 94, 0.05);
        }

        .featured-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--accent);
            color: white;
            font-size: 0.7rem;
            padding: 0.25rem 0.75rem;
            border-radius: 999px;
            font-weight: 700;
        }

        @media (max-width: 768px) {
            .main-title {
                font-size: 2.2rem;
            }
            .group-name {
                font-size: 1.8rem;
            }
            .members-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            .main-title {
                font-size: 1.8rem;
            }
            .group-stats {
                flex-direction: column;
                gap: 1rem;
            }
            .members-grid {
                grid-template-columns: 1fr;
            }
            .section-title {
                font-size: 1.5rem;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 0.6s ease forwards;
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header fade-in">
            <h1 class="main-title">婵姐这大美妞就适合被诸葛法</h1>
            <p class="subtitle">群成员专属展示 · 高端设计呈现</p>
        </header>

        <div class="group-card fade-in">
            <h2 class="group-name">朱展信，要健康幸福</h2>
            <div class="group-stats">
                <div class="stat-item">
                    <div class="stat-value" id="member-count">0</div>
                    <div class="stat-label">成员</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">2026</div>
                    <div class="stat-label">创建</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value">活跃</div>
                    <div class="stat-label">状态</div>
                </div>
            </div>
            <p class="group-desc">
                这是一个由21位成员组成的活跃社交群组，成员们拥有多样的兴趣和独特的个性。
                群聊名称"朱展信，要健康幸福"寄托了所有成员对彼此的美好祝愿。
            </p>
        </div>

        <div class="members-section">
            <h2 class="section-title fade-in">群成员 (21人)</h2>
            <div class="members-grid" id="membersContainer">
            </div>
        </div>
    </div>

    <script>
        const members = [
            { name: "搭上A...", status: "online" },
            { name: "小香猪...", status: "online" },
            { name: "登陆少...", status: "offline" },
            { name: "树莓三...", status: "online" },
            { name: "十八朵...", status: "online" },
            { name: "不知立场", status: "online" },
            { name: "不能还...", status: "offline" },
            { name: "云养俺妹", status: "online" },
            { name: "小妲极", status: "online" },
            { name: "余鲨鲨鲨", status: "online" },
            { name: "棍铲坤", status: "offline" },
            { name: "鞍山小...", status: "online" },
            { name: "护腮宝", status: "online" },
            { name: "是真呱...", status: "online" },
            { name: "ovo", status: "online" },
            { name: "七咩", status: "offline" },
            { name: "jtddhk...", status: "online" },
            { name: "婵姐这...", status: "online", featured: true },
            { name: "Jackey...", status: "online" },
            { name: "仙草山...", status: "online" },
            { name: "火龙果...", status: "online" }
        ];

        const avatarColors = [
            "linear-gradient(135deg, #f43f5e, #8b5cf6)",
            "linear-gradient(135deg, #8b5cf6, #3b82f6)",
            "linear-gradient(135deg, #3b82f6, #10b981)",
            "linear-gradient(135deg, #10b981, #f59e0b)",
            "linear-gradient(135deg, #f59e0b, #ef4444)"
        ];

        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('membersContainer');
            
            members.forEach((member, index) => {
                const memberCard = document.createElement('div');
                memberCard.className = 'member-card fade-in';
                if (member.featured) {
                    memberCard.classList.add('featured-member');
                }

                const colorIndex = index % avatarColors.length;
                const avatarBg = avatarColors[colorIndex];

                let avatarText = member.name.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, '').substring(0, 2);
                if (!avatarText) avatarText = member.name.substring(0, 2);

                memberCard.style.animationDelay = `${index * 0.05}s`;

                memberCard.innerHTML = `
                    ${member.featured ? '<div class="featured-badge">主角</div>' : ''}
                    <div class="member-avatar" style="background: ${avatarBg}">
                        ${avatarText}
                    </div>
                    <div class="member-name">${member.name}</div>
                    <div class="member-status ${member.status === 'online' ? 'status-online' : 'status-offline'}">
                        ${member.status === 'online' ? '在线' : '离线'}
                    </div>
                `;
                container.appendChild(memberCard);
            });

            function animateCount(element, target) {
                let current = 0;
                const increment = target / 50;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        current = target;
                        clearInterval(timer);
                    }
                    element.textContent = Math.floor(current);
                }, 20);
            }
            setTimeout(() => {
                animateCount(document.getElementById('member-count'), members.length);
            }, 500);
        });
    </script>
</body>
</html>
